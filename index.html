<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 22nd Birthday Baberos Lukram! 🌹✨</title>
  <!-- Canvas Confetti Library for high-energy celebrations -->
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --rose-dark: #800f2f;
      --rose-classic: #c9184a;
      --rose-bright: #ff4d6d;
      --rose-light: #fff0f2;
      --gold: #ffb703;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #2b0813 0%, #0f0206 100%);
      font-family: 'Georgia', serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Petals / Celebration Particles Background Overlay */
    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 77, 109, 0.15) 1px, transparent 0px);
      background-size: 24px 24px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      background: rgba(43, 8, 19, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 600px;
      width: 90%;
      margin: 40px auto;
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 0 40px rgba(201, 24, 74, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 77, 109, 0.3);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .rose-header {
      font-size: 3.5rem;
      margin: 0;
      animation: float 3s ease-in-out infinite alternate;
    }

    h1 {
      font-size: 2.8rem;
      margin: 15px 0 5px 0;
      font-weight: normal;
      background: linear-gradient(45deg, #fff, #ffb3c1, #ff4d6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
    }

    .subheading {
      font-size: 1.2rem;
      color: #ffb3c1;
      font-style: italic;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    /* Interactive Microphone / Button status */
    .mic-status {
      font-size: 0.95rem;
      color: #fff;
      font-weight: bold;
      background: linear-gradient(135deg, var(--rose-classic), var(--rose-bright));
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(201, 24, 74, 0.4);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .mic-status:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.6);
    }

    /* 22 Candle Layout */
    .cake-section {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number-candles {
      display: flex;
      gap: 40px;
      margin-bottom: -15px;
      z-index: 2;
    }

    .candle-digit {
      font-size: 6rem;
      font-weight: 900;
      font-family: 'Impact', 'Arial Black', sans-serif;
      position: relative;
      line-height: 1;
      background: linear-gradient(to bottom, #ffccd5, #ff4d6d, #c9184a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.7));
      cursor: pointer;
    }

    .flame {
      width: 20px;
      height: 32px;
      background: radial-gradient(circle, #ffffff 10%, #ffea00 40%, #ff5a00 80%, #ff0000 100%);
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      animation: flicker 0.5s infinite alternate;
      box-shadow: 0 0 20px #ff5a00, 0 0 40px #ffea00;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease;
    }

    .flame.blown {
      opacity: 0;
      transform: translateX(-50%) scale(0);
    }

    .cake-body {
      width: 260px;
      height: 90px;
      background: linear-gradient(to bottom, #ff85a1, #ff4d6d);
      border-radius: 16px 16px 0 0;
      border-bottom: 8px solid #a44a5f;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    /* Video Layout Container */
    .video-section {
      margin-top: 40px;
      border-top: 2px dashed rgba(255, 204, 213, 0.3);
      padding-top: 30px;
    }

    .video-section h3 {
      font-weight: normal;
      color: #ffb3c1;
      margin-bottom: 20px;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 0;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="container">
    <div class="rose-header">🌹</div>
    <h1>Happy 22nd Birthday,<br>Baberos Lukram!</h1>
    <p class="subheading">Wishing you a beautiful blooming celebration ✨</p>

    <!-- Interactive Candle Arena -->
    <div class="cake-section">
      <div class="mic-status" id="mic-btn" onclick="startListening()">🎤 Click to Activate Screen Blowing Mode</div>
      
      <div class="number-candles">
        <div class="candle-digit">2<div class="flame"></div></div>
        <div class="candle-digit">2<div class="flame"></div></div>
      </div>
      <div class="cake-body">🌹 🌹 🌹 🌹</div>
    </div>

    <!-- Video Integration Spot -->
    <div class="video-section">
      <h3>🌹 A Special Message Filmed For You 🎬</h3>
      <div class="video-wrapper">
        <!-- REPLACE LINK WITH YOUR DETAILED INSTANCES -->
        <iframe 
          src="https://youtube.com" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script>
    let candlesLit = true;

    // Fallback tap trigger
    document.querySelectorAll('.candle-digit').forEach(candle => {
      candle.addEventListener('click', () => {
        if(candlesLit) extinguishCandles();
      });
    });

    function startListening() {
      const btn = document.getElementById('mic-btn');
      
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(function(stream) {
          btn.innerText = "💨 Now BLOW onto the screen to make a wish!";
          btn.style.background = "linear-gradient(135deg, #2a9d8f, #264653)";

          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const analyser = audioContext.createAnalyser();
          const microphone = audioContext.createMediaStreamSource(stream);
          const javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

          analyser.smoothingTimeConstant = 0.75;
          analyser.fftSize = 1024;

          microphone.connect(analyser);
          analyser.connect(javascriptNode);
          javascriptNode.connect(audioContext.destination);

          javascriptNode.onaudioprocess = function() {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            let values = 0;

            for (let i = 0; i < array.length; i++) {
              values += array[i];
            }

            const average = values / array.length;

            // Audio peak trigger threshold 
            if (average > 60 && candlesLit) {
              extinguishCandles();
              stream.getTracks().forEach(track => track.stop()); // close microphone cleanly
            }
          };
        })
        .catch(function(err) {
          btn.innerText = "✨ Tap the glowing 22 candles directly!";
        });
    }

    function extinguishCandles() {
      candlesLit = false;
      document.querySelectorAll('.flame').forEach(flame => flame.classList.add('blown'));
      
      const btn = document.getElementById('mic-btn');
      btn.innerText = "🎉 Time to Celebrate! ❤️";
      btn.style.background = "linear-gradient(135deg, #d90429, #ef233c)";

      // Elite celebration explosion combining rose hues and golden fireworks
      var duration = 5 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 60,
          origin: { x: 0 },
          colors: ['#ff4d6d', '#ff758c', '#ffb703', '#ffffff', '#ff0a54']
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 60,
          origin: { x: 1 },
          colors: ['#ff4d6d', '#ff758c', '#ffb703', '#ffffff', '#ff0a54']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>
